[project]
name = "opencontextengine"
version = "0.3.0"
description = "Open-source codebase context engine for AI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "OpenContextEngine Contributors"}]
keywords = ["code", "retrieval", "embedding", "context", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.3.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    # Redis（任务队列）
    "redis>=5.0.0",
    # Milvus 3.0（向量数据库）
    "pymilvus>=3.0.0",
    # 本地个人模式的嵌入式 Milvus Lite
    "milvus-lite>=2.4.0",
    # AST 解析（cAST 切块）
    "tree-sitter==0.25.2", # 0.26 在 Windows 深层遍历时会触发 native access violation
    "tree-sitter-language-pack>=0.1.0",
    "numpy>=1.24.0",
    # SQLite 异步支持（测试用）
    "aiosqlite>=0.19.0",
    "langchain-text-splitters>=1.1.2",
    "psutil>=7.2.2",
]

[project.urls]
Homepage = "https://github.com/JasonEX/oce"
Repository = "https://github.com/JasonEX/oce"
Documentation = "https://github.com/JasonEX/oce/blob/master/README.md"
Issues = "https://github.com/JasonEX/oce/issues"

[project.optional-dependencies]
local-rerank = [
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-env>=1.1.0",
    "freezegun>=1.4.0",
    "faker>=22.0.0",
    "pyarrow>=21.0.0",
    "ruff==0.14.2",
]

[project.scripts]
oce = "oce.cli:main"

[build-system]
# setuptools>=77 支持 PEP 639 的 license 字符串写法与 license-files
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oce*"]

[tool.setuptools.package-data]
# alembic 模板只在 wheel 中存在时，个人模式 oce serve 才能离线跑迁移
"oce.alembic" = ["script.py.mako"]

# ==================== Pytest 配置 ====================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# 测试环境默认使用 SQLite 内存数据库
env = [
    "DB_URL=sqlite+aiosqlite:///:memory:",
]
addopts = [
    "-ra",
    "-m", "not integration",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (database, redis, etc.)",
    "slow: Slow tests (performance, large data)",
    "skip_ci: Skip in CI environment",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ==================== Ruff ====================
[tool.ruff]
target-version = "py311"
extend-exclude = ["src/oce/alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# B008：FastAPI 的 Depends()/Header() 就是设计成写在参数默认值里的。
# UP017：项目统一使用语义更明确的 timezone.utc。
ignore = ["B008", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["oce", "tests"]
