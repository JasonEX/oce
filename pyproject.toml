[project]
name = "opencontextengine"
version = "0.3.0"
description = "Open-source codebase context engine for AI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "OpenContextEngine Contributors"}]
keywords = ["code", "retrieval", "embedding", "context", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.3.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    # Redis task queue (service mode)
    "redis>=5.0.0",
    # Milvus 3.0 vector store
    "pymilvus>=3.0.0",
    # Embedded Milvus Lite for personal mode
    "milvus-lite>=2.4.0",
    # AST parsing for cAST chunking; 0.26 raises a native access violation
    # during deep traversal on Windows
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack>=0.1.0",
    "numpy>=1.24.0",
    # Async SQLite driver: the personal-mode metadata store, also used by tests.
    "aiosqlite>=0.19.0",
    "langchain-text-splitters>=1.1.2",
    "psutil>=7.2.2",
]

[project.urls]
Homepage = "https://github.com/JasonEX/oce"
Repository = "https://github.com/JasonEX/oce"
Documentation = "https://github.com/JasonEX/oce/blob/master/README.md"
Issues = "https://github.com/JasonEX/oce/issues"

[project.optional-dependencies]
local-rerank = [
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-env>=1.1.0",
    "freezegun>=1.4.0",
    "faker>=22.0.0",
    "pyarrow>=21.0.0",
    "ruff==0.14.2",
    "mypy>=1.14",
]

[project.scripts]
oce = "oce.cli:main"

[build-system]
# setuptools>=77 understands the PEP 639 license string and license-files
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oce*"]

[tool.setuptools.package-data]
# The alembic template must ship in the wheel for oce serve to migrate offline
"oce.alembic" = ["script.py.mako"]

# ==================== pytest ====================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Tests default to an in-memory SQLite database
env = [
    "DB_URL=sqlite+aiosqlite:///:memory:",
]
addopts = [
    "-ra",
    "-m", "not integration",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (database, redis, etc.)",
    "slow: Slow tests (performance, large data)",
    "skip_ci: Skip in CI environment",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ==================== Ruff ====================
[tool.ruff]
target-version = "py311"
extend-exclude = ["src/oce/alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header() are designed as parameter defaults.
# UP017: the project spells timezone.utc for clarity.
ignore = ["B008", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["oce", "tests"]

# ==================== mypy ====================
[tool.mypy]
# 3.12 is the lowest version whose stub parsing accepts numpy's PEP 695 type
# statements; the runtime floor stays 3.11 and CI still runs the tests there.
python_version = "3.12"
files = ["src/oce"]
mypy_path = "src"
exclude = ["src/oce/alembic/versions"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
# Some adapters lack upstream stubs; optional model packages may be absent.
# Installed packages with type information are still checked.
module = ["pymilvus", "pymilvus.*", "onnxruntime", "tokenizers", "psutil"]
ignore_missing_imports = true
