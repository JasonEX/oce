name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the code.
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor pyproject declares (StrEnum); 3.13 is the development version.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails when uv.lock and pyproject disagree, so contributors keep the lock in sync.
      - name: Install dependencies (locked)
        run: uv sync --extra dev --locked

      # Importing never connects (the engine is lazy); SQLite is set anyway. This only checks the modules load.
      - name: Smoke import
        env:
          DB_URL: "sqlite+aiosqlite:///:memory:"
        run: uv run python -c "from oce.main import app; print('import OK')"

      - name: Run Ruff
        if: matrix.python-version == '3.13'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Type errors are the class of refactor mistake the lane-degrading
      # retrieval code would otherwise absorb at runtime.
      - name: Run mypy
        if: matrix.python-version == '3.13'
        run: uv run mypy

      # One process per test file: the tree-sitter grammars and Milvus Lite
      # accumulate past 10 GB in a single process. No set -e inside the loop,
      # so every file runs and all failures are visible at once.
      - name: Run unit tests (one process per file)
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            echo "::group::pytest ${file}"
            if ! uv run pytest "${file}" -q; then
              failed=1
              echo "::error file=${file}::unit tests failed"
            fi
            echo "::endgroup::"
          done < <(find tests/unit -name 'test_*.py' -print0 | sort -z)
          exit "${failed}"

  build:
    name: build (packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      # Check that the packaging configuration produces an sdist and a wheel.
      - name: Build sdist + wheel
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
